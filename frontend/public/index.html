<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F4F6F3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141B1D" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Plan, hand in and review academic group projects in one place." />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Literata:opsz,wght@7..72,500;7..72,600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint so the page never flashes.
      try {
        var theme = localStorage.getItem('pcp-theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
    <title>Project Collaboration Portal</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to use the Project Collaboration Portal.</noscript>
    <div id="root"></div>
  </body>
</html>
